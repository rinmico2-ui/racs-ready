<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description" viewBox="0 0 1540 1180" width="1540" height="1180" font-family="Arial, sans-serif"><title id="title">Web architecture — request and response path</title><desc id="description">EJS executes on the server. The browser receives HTML, CSS and JavaScript, then uses JSON APIs, SSE chat and Socket.IO. All backend components share one Node.js process.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7 Z" fill="#64748b"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="35" y="42" font-size="25" font-weight="700" fill="#0f172a">Web architecture — request and response path</text><text x="35" y="70" font-size="13" fill="#475569">CALIDRO RACS · Repository audit: 09 October 2026 · Arrows name data or communication flows</text><g><path d="M 395 225 C 492.5 225, 492.5 220, 590 220" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="492.5" y="215.5" text-anchor="middle" font-size="12" fill="#334155" stroke="white" stroke-width="5" paint-order="stroke"><tspan x="492.5" dy="0">HTTPS page / API request</tspan></text></g><g><path d="M 590 240 C 492.5 240, 492.5 245, 395 245" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="492.5" y="235.5" text-anchor="middle" font-size="12" fill="#334155" stroke="white" stroke-width="5" paint-order="stroke"><tspan x="492.5" dy="0">HTML / JSON / assets</tspan></text></g><g><path d="M 770 270 C 770 310, 770 310, 770 350" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="860" y="303" text-anchor="middle" font-size="12" fill="#334155" stroke="white" stroke-width="5" paint-order="stroke"><tspan x="860" dy="0">Static file / probe</tspan></text></g><g><path d="M 745 270 C 720 415, 720 415, 745 560" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="835" y="408" text-anchor="middle" font-size="12" fill="#334155" stroke="white" stroke-width="5" paint-order="stroke"><tspan x="835" dy="0">Application request</tspan></text></g><g><path d="M 950 620 C 1065 620, 1065 610, 1180 610" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="1065" y="608" text-anchor="middle" font-size="12" fill="#334155" stroke="white" stroke-width="5" paint-order="stroke"><tspan x="1065" dy="0">Session / user / permissions</tspan></text></g><g><path d="M 770 680 C 770 730, 770 730, 770 780" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="860" y="723" text-anchor="middle" font-size="12" fill="#334155" stroke="white" stroke-width="5" paint-order="stroke"><tspan x="860" dy="0">Authenticated / allowed request</tspan></text></g><g><path d="M 950 850 C 1065 850, 1065 630, 1180 630" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="1065" y="733" text-anchor="middle" font-size="12" fill="#334155" stroke="white" stroke-width="5" paint-order="stroke"><tspan x="1065" dy="0">Mongoose reads and writes</tspan></text></g><g><path d="M 770 880 C 770 945, 770 945, 770 1010" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="860" y="938" text-anchor="middle" font-size="12" fill="#334155" stroke="white" stroke-width="5" paint-order="stroke"><tspan x="860" dy="0">Template and view data</tspan></text></g><g><path d="M 590 1032 C 492.5 1032, 492.5 197, 395 197" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="492.5" y="607.5" text-anchor="middle" font-size="12" fill="#334155" stroke="white" stroke-width="5" paint-order="stroke"><tspan x="492.5" dy="0">Rendered HTML</tspan></text></g><g><path d="M 395 203 L 415 128 L 1160 128 L 1180 203" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="787.5" y="121" text-anchor="middle" font-size="12" fill="#334155" stroke="white" stroke-width="5" paint-order="stroke"><tspan x="787.5" dy="0">Socket transport / GPS</tspan></text></g><g><path d="M 1180 247 L 1160 322 L 415 322 L 395 247" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="787.5" y="315" text-anchor="middle" font-size="12" fill="#334155" stroke="white" stroke-width="5" paint-order="stroke"><tspan x="787.5" dy="0">Scoped notifications / location</tspan></text></g><g><path d="M 1335 450 C 1335 505, 1335 505, 1335 560" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="1425" y="498" text-anchor="middle" font-size="12" fill="#334155" stroke="white" stroke-width="5" paint-order="stroke"><tspan x="1425" dy="0">Verified gateway event processing</tspan></text></g><g><path d="M 950 830 C 1065 830, 1065 830, 1180 830" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="1065" y="823" text-anchor="middle" font-size="12" fill="#334155" stroke="white" stroke-width="5" paint-order="stroke"><tspan x="1065" dy="0">Chat question</tspan></text></g><g><path d="M 1180 860 C 787.5 860, 787.5 255, 395 255" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="787.5" y="550.5" text-anchor="middle" font-size="12" fill="#334155" stroke="white" stroke-width="5" paint-order="stroke"><tspan x="787.5" dy="0">Answer / streamed tokens</tspan></text></g><g><path d="M 950 830 C 1065 830, 1065 1065, 1180 1065" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="1065" y="940.5" text-anchor="middle" font-size="12" fill="#334155" stroke="white" stroke-width="5" paint-order="stroke"><tspan x="1065" dy="0">Authorized upload / download</tspan></text></g><g><path d="M 200 280 C 180 360, 180 360, 200 440" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="290" y="353" text-anchor="middle" font-size="12" fill="#334155" stroke="white" stroke-width="5" paint-order="stroke"><tspan x="290" dy="0">
services:
  - type: web
    name: racs-ready
    runtime: node
    rootDir: .
    buildCommand: npm install
    startCommand: node server/index.js
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: UV_THREADPOOL_SIZE
        value: "16"
      - key: MONGODB_MAX_POOL_SIZE
        value: "20"
      - key: MONGODB_MIN_POOL_SIZE
        value: "2"
      - key: MONGODB_WAIT_QUEUE_TIMEOUT_MS
        value: "5000"
      - key: BCRYPT_ROUNDS
        value: "11"
      - key: EMAIL_DELIVERY_MODE
        value: outbox
      - key: EMAIL_OUTBOX_CONCURRENCY
        value: "2"
      - key: EMAIL_OUTBOX_SECRET
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: PAYMONGO_SECRET_KEY
        sync: false
      - key: PAYMONGO_PUBLIC_KEY
        sync: false
      - key: PAYMONGO_WEBHOOK_SECRET
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: CLOUDINARY_HVAC_FOLDER
        value: racs-ready/hvac
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URI
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: FROM_EMAIL
        value: mxwllmallari1702@gmail.com
      - key: FROM_NAME
        value: CALIDRO RACS
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_MAX_OUTPUT_TOKENS
        value: "4500"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: TAVILY_API_KEY
        sync: false

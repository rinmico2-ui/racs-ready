# Merge http.middlewares into the existing Dokploy Traefik file.
# Attach racs-site-traffic and racs-site-capacity to the HTTPS router.
# Attach racs-signup-traffic only to a separate POST registration router.
# See docs/dokploy-security-steps.md before enabling proxy header trust.
http:
  middlewares:
    racs-site-traffic:
      rateLimit:
        average: 10
        period: 1s
        burst: 50
    racs-site-capacity:
      rateLimit:
        average: 60
        period: 1s
        burst: 120
        sourceCriterion:
          requestHost: true
    racs-signup-traffic:
      rateLimit:
        average: 20
        period: 15m
        burst: 5
    racs-response-headers:
      headers:
        permissionsPolicy: "camera=(self), geolocation=(self), microphone=(), payment=(), usb=()"
